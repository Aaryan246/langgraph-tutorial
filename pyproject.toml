version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Aaryan Rastogi", email = "aaryan24602@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "black>=26.10.1",
    "isort>=9.0.2",
    "langchain>=1.4.7",
